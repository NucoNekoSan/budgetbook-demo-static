name: Refresh static mirror

# 動的な budgetbook-demo を静的 HTML に再 mirror して push する。
# - 手動実行 (workflow_dispatch)
# - 毎週月曜 00:00 UTC (= 09:00 JST) に自動実行
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write  # 生成物を git push するために必要

concurrency:
  group: refresh-mirror
  cancel-in-progress: false  # 走行中の job を保護

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout static repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout budgetbook-demo (動的 demo)
        uses: actions/checkout@v4
        with:
          repository: NucoNekoSan/budgetbook-demo
          path: source-demo
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: source-demo/budgetbook/requirements.txt

      - name: Install demo deps + mirror deps
        run: |
          python -m pip install --upgrade pip
          pip install -r source-demo/budgetbook/requirements.txt
          pip install requests beautifulsoup4

      - name: Apply migrations + seed demo data
        working-directory: source-demo/budgetbook
        env:
          DJANGO_DB_PATH: ${{ github.workspace }}/source-demo/budgetbook/db.sqlite3
          SECRET_KEY: ci-ephemeral-${{ github.run_id }}-not-used-publicly
          DEBUG: 'False'
          ALLOWED_HOSTS: '127.0.0.1,localhost'
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_data --reset

      - name: Start runserver in background
        working-directory: source-demo/budgetbook
        env:
          DJANGO_DB_PATH: ${{ github.workspace }}/source-demo/budgetbook/db.sqlite3
          SECRET_KEY: ci-ephemeral-${{ github.run_id }}-not-used-publicly
          DEBUG: 'False'
          ALLOWED_HOSTS: '127.0.0.1,localhost'
          DEMO_MODE: '1'
          DEMO_ALLOW_WRITES: '0'
          DEMO_AUTO_LOGIN: '1'
          PYTHONIOENCODING: utf-8
        run: |
          nohup python manage.py runserver 127.0.0.1:8765 --noreload --insecure > /tmp/runserver.log 2>&1 &
          echo $! > /tmp/runserver.pid
          # ヘルスチェック
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8765/healthz > /dev/null; then
              echo "runserver is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::runserver did not start in 30s"
          cat /tmp/runserver.log
          exit 1

      - name: Run mirror script
        run: |
          python scripts/mirror.py

      - name: Stop runserver
        if: always()
        run: |
          if [ -f /tmp/runserver.pid ]; then
            kill $(cat /tmp/runserver.pid) 2>/dev/null || true
          fi

      - name: Verify mirror output
        run: |
          test -f public/index.html
          test -s public/static/css/style.css
          # 機微パターンが mirror 出力に混入していないか確認
          if grep -rilE 'isonohideki@|risa19841013@|home\.nuconeko-garden|192\.168\.1\.(37|40)' public/; then
            echo "::error::Sensitive pattern detected in mirror output"
            exit 1
          fi
          echo "Mirror output verified clean"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DEMO_SHA=$(cd source-demo && git rev-parse --short HEAD)
          git commit -m "chore: refresh static mirror

Source: NucoNekoSan/budgetbook-demo @ ${DEMO_SHA}
Triggered: ${{ github.event_name }} (run ${{ github.run_id }})"
          git push