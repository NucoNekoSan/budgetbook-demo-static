
<tr class="inline-edit-row" id="acct-inline-edit-5">
<td colspan="5">
<form action="#" class="form-grid inline-edit-form" data-neutralize="閲覧専用デモです (静的スナップショット)">

<div class="inline-edit-form__title">「電子マネー」を編集</div>
<div class="field">
<label for="id_name">口座名</label>
<input class="form-input" id="id_name" maxlength="100" name="name" placeholder="例: 三菱UFJ、現金、楽天カード" required="" type="text" value="電子マネー"/>
</div>
<div class="field">
<label for="id_kind">会計区分</label>
<select class="form-input" id="id_kind" name="kind">
<option selected="" value="asset">資産</option>
<option value="liability">負債</option>
</select>
</div>
<div class="field">
<label for="id_opening_balance">初期残高</label>
<input aria-describedby="id_opening_balance_helptext" class="form-input" id="id_opening_balance" name="opening_balance" required="" step="1" type="number" value="8000"/>
<div class="meta">資産口座は 0 円以上で入力してください。 取引/振替が登録済みのため、変更すると過去残高が再計算されます。</div>
</div>
<div class="field">
<label for="id_notes">メモ</label>
<textarea class="form-input" cols="40" id="id_notes" name="notes" placeholder="任意メモ" rows="2">
</textarea>
</div>
<div class="button-row form-grid__actions">
<button class="btn btn--primary btn--sm" type="submit">更新する</button>
<button class="btn btn--soft btn--sm" type="button">キャンセル</button>
</div>
</form>
</td>
</tr>
