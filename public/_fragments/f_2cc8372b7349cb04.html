
<tr class="inline-edit-row" id="payment-method-inline-edit-2">
<td colspan="7">
<form action="#" class="form-grid inline-edit-form" data-neutralize="閲覧専用デモです (静的スナップショット)">

<div class="inline-edit-form__title">「普通預金」を編集</div>
<div class="field">
<label for="id_name">支払手段名</label>
<input class="form-input" id="id_name" maxlength="100" name="name" placeholder="例: 現金、カードA、電子マネーA" required="" type="text" value="普通預金"/>
</div>
<div class="field">
<label for="id_kind">種別</label>
<select class="form-input" id="id_kind" name="kind" required="">
<option value="">---------</option>
<option value="cash">現金</option>
<option selected="" value="bank">銀行口座</option>
<option value="credit_card">クレジットカード</option>
<option value="debit_card">デビットカード</option>
<option value="electronic_money">電子マネー</option>
<option value="qr">QR決済</option>
<option value="other">その他</option>
</select>
</div>
<div class="field">
<label for="id_account">通常利用口座</label>
<select class="form-input" id="id_account" name="account">
<option value="">未指定</option>
<option selected="" value="2">普通預金</option>
<option value="1">現金</option>
<option value="4">証券口座</option>
<option value="3">貯蓄預金</option>
<option value="5">電子マネー</option>
<option value="8">クレジットカード</option>
<option value="6">住宅ローン</option>
<option value="7">自動車ローン</option>
</select>
</div>
<div class="field">
<label for="id_settlement_account">引落元口座</label>
<select class="form-input" id="id_settlement_account" name="settlement_account">
<option selected="" value="">未指定</option>
<option value="2">普通預金</option>
<option value="1">現金</option>
<option value="4">証券口座</option>
<option value="3">貯蓄預金</option>
<option value="5">電子マネー</option>
<option value="8">クレジットカード</option>
<option value="6">住宅ローン</option>
<option value="7">自動車ローン</option>
</select>
</div>
<div class="field">
<label for="id_closing_day">締日</label>
<input class="form-input" id="id_closing_day" inputmode="numeric" max="31" min="0" name="closing_day" required="" step="1" type="number" value="0"/>
</div>
<div class="field">
<label for="id_settlement_day">引落日</label>
<input class="form-input" id="id_settlement_day" inputmode="numeric" max="31" min="0" name="settlement_day" required="" step="1" type="number" value="0"/>
</div>
<div class="field">
<label for="id_notes">メモ</label>
<textarea class="form-input" cols="40" id="id_notes" name="notes" placeholder="任意メモ" rows="2">
デモデータ用の支払手段マスタ</textarea>
</div>
<div class="button-row form-grid__actions">
<button class="btn btn--primary btn--sm" type="submit">更新する</button>
<button class="btn btn--soft btn--sm" type="button">キャンセル</button>
</div>
</form>
</td>
</tr>
