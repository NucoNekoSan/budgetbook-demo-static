<div class="panel__body">
<div class="toolbar toolbar--form">
<div>
<h2 class="section-title section-title--tight">取引を追加</h2>
<div class="meta">
        
          登録後は一覧と集計が自動で更新されます。
        
      </div>
</div>
</div>
<div class="form-mode-tabs button-row">
<button class="btn btn--primary" type="button">通常取引</button>
<button class="btn btn--ghost" type="button">振替</button>
</div>
<form action="#" class="form-grid" data-neutralize="閲覧専用デモです (静的スナップショット)">
<input name="month" type="hidden" value="2026-05"/>
<div class="field">
<label for="id_date">日付</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_date" name="date" required="" type="date" value="2026-05-21"/>
</div>
<div class="field">
<label for="id_account">口座</label>
<select class="form-input" id="id_account" name="account" required="">
<option selected="" value="">---------</option>
<option value="8">クレジットカード</option>
<option value="6">住宅ローン</option>
<option value="2">普通預金</option>
<option value="1">現金</option>
<option value="7">自動車ローン</option>
<option value="4">証券口座</option>
<option value="3">貯蓄預金</option>
<option value="5">電子マネー</option>
</select>
</div>
<div class="field">
<label for="id_kind">種別</label>
<select class="form-input" id="id_kind" name="kind">
<option value="income">収入</option>
<option selected="" value="expense">支出</option>
</select>
</div>
<div class="field">
<label for="id_category">カテゴリ</label>
<select class="form-input" id="id_category" name="category" required="">
<option selected="" value="">---------</option>
<option value="21">支出 | その他</option>
<option value="18">支出 | ふるさと納税</option>
<option value="19">支出 | サブスク</option>
<option value="10">支出 | 交通費</option>
<option value="15">支出 | 交際費</option>
<option value="16">支出 | 保険料</option>
<option value="11">支出 | 医療費</option>
<option value="9">支出 | 外食</option>
<option value="13">支出 | 娯楽</option>
<option value="4">支出 | 家賃・住宅ローン</option>
<option value="12">支出 | 教育費</option>
<option value="8">支出 | 日用品</option>
<option value="5">支出 | 水道光熱費</option>
<option value="17">支出 | 税金</option>
<option value="14">支出 | 衣料・美容</option>
<option value="6">支出 | 通信費</option>
<option value="20">支出 | 金利・手数料</option>
<option value="7">支出 | 食費</option>
</select>
</div>
<div class="field">
<label for="id_amount">金額</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_amount" inputmode="numeric" min="1" name="amount" required="" step="1" type="number"/>
</div>
<div class="field">
<label for="id_description">摘要</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_description" maxlength="120" name="description" placeholder="例: スーパー、給与、電気代" required="" type="text"/>
</div>
<div class="field">
<label for="id_memo">メモ</label>
<textarea autocomplete="off" class="form-input" cols="40" enterkeyhint="done" id="id_memo" name="memo" placeholder="任意メモ" rows="4">
</textarea>
</div>
<div id="medical-fields"></div>
<div id="transaction-preview">
<div class="preview-box preview-box--empty">
<span class="meta">金額とカテゴリを入力するとプレビューが表示されます。</span>
</div>
</div>
<div class="button-row form-grid__actions">
<button class="btn btn--primary" type="submit">保存する</button>
<button class="btn btn--ghost" type="button">キャンセル</button>
</div>
</form>
<div class="meta form-footer">
    
      カテゴリの追加や名称変更は設定画面（/settings/）から行えます。
    
  </div>
</div>
