<div class="panel__body">
<div class="toolbar toolbar--form">
<div>
<h2 class="section-title section-title--tight">振替を追加</h2>
<div class="meta">
        
          登録後は一覧と集計が自動で更新されます。
        
      </div>
</div>
</div>
<div class="form-mode-tabs button-row">
<button class="btn btn--ghost" type="button">通常取引</button>
<button class="btn btn--primary" type="button">振替</button>
</div>
<form action="#" class="form-grid" data-neutralize="閲覧専用デモです (静的スナップショット)">
<input name="month" type="hidden" value="2026-07"/>
<div class="field">
<label for="id_date">日付</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_date" name="date" required="" type="date" value="2026-07-01"/>
</div>
<div class="field">
<label for="id_from_account">出金元口座</label>
<select class="form-input" id="id_from_account" name="from_account" required="">
<option value="">---------</option>
<option selected="" value="8">クレジットカード</option>
<option value="6">住宅ローン</option>
<option value="2">普通預金</option>
<option value="1">現金</option>
<option value="7">自動車ローン</option>
<option value="4">証券口座</option>
<option value="3">貯蓄預金</option>
<option value="5">電子マネー</option>
</select>
</div>
<div class="field">
<label for="id_to_account">入金先口座</label>
<select class="form-input" id="id_to_account" name="to_account" required="">
<option value="">---------</option>
<option value="8">クレジットカード</option>
<option selected="" value="6">住宅ローン</option>
<option value="2">普通預金</option>
<option value="1">現金</option>
<option value="7">自動車ローン</option>
<option value="4">証券口座</option>
<option value="3">貯蓄預金</option>
<option value="5">電子マネー</option>
</select>
</div>
<div class="field">
<label for="id_amount">金額</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_amount" inputmode="numeric" min="1" name="amount" required="" step="1" type="number"/>
</div>
<div class="field">
<label for="id_description">摘要</label>
<input autocomplete="off" class="form-input" enterkeyhint="next" id="id_description" maxlength="120" name="description" placeholder="例: 普通預金A → 普通預金B" required="" type="text"/>
</div>
<div class="field">
<label for="id_memo">メモ</label>
<textarea autocomplete="off" class="form-input" cols="40" enterkeyhint="done" id="id_memo" name="memo" placeholder="任意メモ" rows="4">
</textarea>
</div>
<div class="button-row form-grid__actions">
<button class="btn btn--primary" type="submit">保存する</button>
<button class="btn btn--ghost" type="button">キャンセル</button>
</div>
</form>
<div class="meta form-footer">
    
      振替は収入合計・支出合計には含まれず、口座残高にのみ反映されます。
    
  </div>
</div>
